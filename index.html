<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="color-scheme" content="dark">
<title>跑馬燈・LED 跑馬燈</title>

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="跑馬燈">
<meta name="format-detection" content="telephone=no">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">

<!-- 中文字體（Google Fonts，只在用到時下載對應字集） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Huninn&family=LXGW+WenKai+TC:wght@700&family=Iansui&display=swap">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== 主畫面 ===================== -->
<main id="app">

  <!-- 首頁 -->
  <section class="screen is-active" data-screen="home">
    <header class="nav"><span class="nav__title">跑馬燈</span></header>

    <div class="page">
      <h2 class="sec">跑馬燈</h2>

      <div class="hero" id="heroCard" role="button" tabindex="0" aria-label="全螢幕播放">
        <div class="hero__stage">
          <div class="hero__track" id="heroTrack">
            <span class="hero__text" id="heroA"></span>
            <span class="hero__text" id="heroB" aria-hidden="true"></span>
          </div>
        </div>
        <button class="hero__edit" id="heroEdit" aria-label="編輯文字">✎</button>
      </div>

      <div class="fx-list" id="fxList"></div>

      <h2 class="sec">更多</h2>
      <div class="more">
        <button class="bubble bubble--yellow" data-more="font" aria-label="字體">A</button>
        <button class="bubble bubble--pink" data-more="ink" aria-label="字體顏色">✦</button>
        <button class="bubble bubble--green" data-more="bg" aria-label="背景顏色">▣</button>
        <button class="bubble bubble--blue" data-more="speed" aria-label="速度">⚡</button>
      </div>
    </div>
  </section>

  <!-- 場景 -->
  <section class="screen" data-screen="scenes" hidden>
    <header class="nav"><span class="nav__title">場景</span></header>
    <div class="page">
      <button class="btn-save" id="saveScene">＋　儲存目前畫面</button>
      <div class="scene-list" id="sceneList"></div>
      <p class="empty" id="sceneEmpty">
        還沒有場景<br>
        <span>把常用的文字存起來，現場一鍵播放。</span>
      </p>
    </div>
  </section>

  <!-- 我 -->
  <section class="screen" data-screen="me" hidden>
    <header class="nav"><span class="nav__title">我</span></header>
    <div class="page">
      <div class="card">
        <label class="setting">
          <span>螢幕常亮</span>
          <input type="checkbox" class="switch" id="setWake">
        </label>
        <label class="setting">
          <span>LED 點陣效果</span>
          <input type="checkbox" class="switch" id="setDots">
        </label>
        <div class="setting setting--col">
          <span>亮度</span>
          <input type="range" id="setBright" min="30" max="100" step="5">
        </div>
        <div class="setting setting--col">
          <span>預設效果</span>
          <select id="setDefaultFx" class="select"></select>
        </div>
      </div>

      <div class="card">
        <details class="help">
          <summary>使用說明</summary>
          <ol>
            <li>點首頁的預覽卡片 → 全螢幕播放。</li>
            <li>播放時點一下畫面 → 開啟編輯面板。</li>
            <li>編輯面板由上到下：字體、快慢、大小、字體顏色、背景顏色、其它。</li>
            <li>「＋」可以把目前畫面存成場景。</li>
            <li>建議橫放手機，字會更大。</li>
            <li>想看全螢幕、不要網址列：Safari → 分享 → 加入主畫面。</li>
          </ol>
        </details>
      </div>

      <div class="card">
        <button class="danger" id="resetAll">清除所有設定與場景</button>
      </div>

      <p class="ver">LED 跑馬燈　v1.0</p>
    </div>
  </section>

  <!-- 底部頁籤 -->
  <nav class="tabbar" id="tabbar">
    <button class="tab is-active" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="4"/><path d="M8 12h8"/></svg>
      <span>跑馬燈</span>
    </button>
    <button class="tab" data-tab="scenes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M10 8.8l5.5 3.2-5.5 3.2z" class="fill"/></svg>
      <span>場景</span>
    </button>
    <button class="tab" data-tab="me">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.2" r="3.6"/><path d="M4.8 20c0-3.7 3.2-6.2 7.2-6.2s7.2 2.5 7.2 6.2"/></svg>
      <span>我</span>
    </button>
  </nav>
</main>

<!-- ===================== 全螢幕播放 ===================== -->
<section class="play is-clean" id="play" hidden>
  <div class="stage" id="stage">
    <div class="render" id="render"></div>
    <div class="dim" id="dim"></div>
  </div>

  <div class="play-chrome" id="playChrome">
    <button class="round-btn" id="playBack" aria-label="返回">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="round-btn" id="playSave" aria-label="儲存場景">＋</button>
  </div>

  <div class="sheet-wrap" id="sheetWrap">
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet" id="sheet">
      <div class="sheet__head">
        <span class="sheet__title" id="sheetTitle">字體</span>
        <span class="sheet__actions">
          <button class="sheet__text" id="sheetText">編輯文字</button>
          <button class="sheet__close" id="sheetClose" aria-label="關閉">✕</button>
        </span>
      </div>

      <div class="fonts" id="fontChips"></div>

      <div class="slide-row" id="rowSpeed">
        <span class="slide-end">慢</span>
        <input type="range" id="rSpeed" min="0" max="100" step="1">
        <span class="slide-end">快</span>
      </div>

      <div class="slide-row" id="rowSize">
        <span class="slide-end">小</span>
        <input type="range" id="rSize" min="0" max="100" step="1">
        <span class="slide-end">大</span>
      </div>

      <h3 class="sheet__label" id="labelInk">字體顏色</h3>
      <div class="colors" id="inkColors"></div>

      <h3 class="sheet__label" id="labelBg">背景顏色</h3>
      <div class="colors" id="bgColors"></div>

      <h3 class="sheet__label">其它</h3>
      <div class="tools" id="tools"></div>
    </div>
  </div>
</section>

<!-- ===================== 文字編輯 ===================== -->
<div class="modal" id="textModal" hidden>
  <div class="modal__card">
    <h3>文字內容</h3>
    <textarea id="textInput" rows="3" maxlength="200" placeholder="輸入要顯示的文字"></textarea>
    <p class="modal__hint">換行可以顯示多行</p>
    <button class="btn-primary" id="textDone">完成</button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js" defer></script>
</body>
</html>
